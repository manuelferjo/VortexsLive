# Compila Vortexs Live en GitHub con cada cambio y pasa las pruebas del chat y del motor.
# Al publicar una versión (Release con etiqueta v3.1, v4.0…), adjunta el ZIP de descarga a la Release.
name: Compilar

on:
  push:
    branches: [main]
    # Subir una etiqueta (git push origin v4.23) crea la Release con sus notas y le adjunta los ZIP.
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  # A mano (Actions → Compilar → Run workflow): si se indica una etiqueta, adjunta el ZIP a esa Release.
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Release a la que adjuntar el ZIP (por ejemplo v3.0). Vacío: solo compilar."
        required: false
        default: ""

permissions:
  contents: write   # para adjuntar el ZIP a la Release

jobs:
  compilar:
    runs-on: windows-latest
    env:
      # Firma del programa (SSL.com eSigner). Si estos secretos no existen, se salta la firma.
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Compilar VortexsLive.exe
        shell: cmd
        run: build.bat < NUL

      - name: Comprobar que se ha creado el programa
        shell: pwsh
        run: |
          if (-not (Test-Path VortexsLive.exe)) { throw "No se ha creado VortexsLive.exe (mira el paso anterior)" }
          "VortexsLive.exe: $([math]::Round((Get-Item VortexsLive.exe).Length / 1KB)) KB"

      # Obligatoria: con las actualizaciones automáticas, una versión que no abre llegaría a todos.
      - name: Comprobar que el programa abre
        shell: pwsh
        run: |
          $p = Start-Process .\VortexsLive.exe -ArgumentList "--autoprueba" -PassThru -RedirectStandardError autoprueba-error.txt -RedirectStandardOutput autoprueba.txt
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "VortexsLive.exe no terminó la autoprueba en 60 s" }
          Get-Content autoprueba.txt, autoprueba-error.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "VortexsLive.exe falla al abrir (código $($p.ExitCode)): esta versión no se puede publicar" }

      # Si una versión recién actualizada falla al abrir, vuelve sola a la anterior (.old).
      - name: Probar la vuelta a la versión anterior
        shell: pwsh
        run: |
          $d = "prueba-vuelta"; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item VortexsLive.exe "$d\VortexsLive.exe"
          Copy-Item VortexsLive.exe "$d\VortexsLive.exe.old"
          "anterior" | Set-Content "$d\marca-anterior.txt"
          (Get-Item "$d\VortexsLive.exe.old").LastWriteTime = (Get-Date).AddDays(-1)
          $p = Start-Process "$d\VortexsLive.exe" -ArgumentList "--fallo-de-prueba" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "La versión que falla no se cerró" }
          Start-Sleep 4
          Get-Process VortexsLive -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($p.ExitCode -ne 2) { throw "Al fallar al abrir debería volver a la anterior (código 2), pero salió con $($p.ExitCode)" }
          if (-not (Test-Path "$d\VortexsLive.exe.fallida")) { throw "No se apartó la versión que falla (.fallida)" }
          if (Test-Path "$d\VortexsLive.exe.old") { throw "La versión anterior no volvió a su sitio" }
          if (-not (Test-Path "$d\VortexsLive.exe")) { throw "Falta VortexsLive.exe tras volver atrás" }
          $inf = Get-ChildItem "$env:APPDATA\VortexsLive\errores\error-*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $inf -or -not (Select-String -Path $inf.FullName -Pattern "Fallo de prueba" -Quiet)) { throw "No se guardó el informe del error" }
          "Vuelta atrás probada: la versión que falla queda como .fallida, vuelve la anterior y hay informe ($($inf.Name))."

      - name: Pruebas del chat
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:verifychat.exe /r:System.Web.Extensions.dll pruebas\VerifyChat.cs
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron compilar las pruebas" }
          .\verifychat.exe VortexsLive.exe salida.txt
          $esperada = Get-Content pruebas\salida-esperada.txt -Encoding utf8
          $salida = Get-Content salida.txt -Encoding utf8
          $dif = Compare-Object $esperada $salida -SyncWindow 0
          if ($dif) {
            $dif | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            throw "Las pruebas del chat no dan el resultado esperado ($($dif.Count) diferencias)"
          }
          "Pruebas del chat: $($salida.Count) líneas idénticas al resultado esperado."

      - name: Prueba del motor (vídeo de verdad con ffmpeg)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress | Out-Null
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          $ff = (Get-Command ffmpeg).Source
          "ffmpeg: $ff"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:verifyengine.exe pruebas\VerifyEngine.cs
          if ($LASTEXITCODE -ne 0) { throw "No se pudo compilar la prueba del motor" }
          .\verifyengine.exe VortexsLive.exe $ff prueba-motor
          if ($LASTEXITCODE -ne 0) { throw "La prueba del motor ha fallado (mira las líneas FALLO)" }

      # Capturas de cada pantalla (asistente, atajos, pestañas…) para revisar la interfaz sin abrir el
      # programa: se descargan desde la página de esta ejecución (artefacto "capturas").
      - name: Capturas de la interfaz
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force capturas-app | Out-Null
          Copy-Item VortexsLive.exe capturas-app\
          $p = Start-Process capturas-app\VortexsLive.exe -ArgumentList "--capturas=$PWD\capturas" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Las capturas no terminaron en 2 minutos" }
          Get-ChildItem capturas | ForEach-Object { "$($_.Name): $([math]::Round($_.Length / 1KB)) KB" }
          foreach ($n in @("13-registro.png","13-rendimiento.png")) { if (Test-Path "capturas\$n") { $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("capturas\$n")); for ($i = 0; $i -lt $b.Length; $i += 20000) { "TROZO $n " + $b.Substring($i, [Math]::Min(20000, $b.Length - $i)) } } }

      - name: Guardar las capturas
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: capturas/*.png

      - name: Comprobar que la versión coincide con la etiqueta
        if: github.event_name == 'release' || inputs.etiqueta != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta || github.ref_name }}
        run: |
          $v = (Select-String -Path src\MainForm.cs -Pattern 'const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:ETIQUETA) { throw "La etiqueta es $env:ETIQUETA pero src\MainForm.cs dice Version = $v. Cámbialo para que coincidan." }
          "Versión $v = etiqueta $env:ETIQUETA"
          if (-not (Select-String -Path src\Novedades.cs -SimpleMatch -Pattern "{ `"$v`"," -Quiet)) { throw "Falta la entrada de la $v en src\Novedades.cs (ReleaseNews): es lo que ve el usuario al actualizar." }

      # Firma digital: Windows (SmartScreen) muestra "Vortexs" como editor en vez de "desconocido".
      # Solo al publicar una versión (cada firma cuenta en el plan de eSigner) y si hay secretos.
      - name: Firmar VortexsLive.exe
        if: (github.event_name == 'release' || inputs.etiqueta != '' || startsWith(github.ref, 'refs/tags/v')) && env.ES_USERNAME != ''
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ env.ES_USERNAME }}
          password: ${{ env.ES_PASSWORD }}
          credential_id: ${{ env.ES_CREDENTIAL_ID }}
          totp_secret: ${{ env.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/VortexsLive.exe
          output_path: ${{ github.workspace }}/firmado
          environment_name: PROD

      - name: Usar el programa firmado
        if: (github.event_name == 'release' || inputs.etiqueta != '' || startsWith(github.ref, 'refs/tags/v')) && env.ES_USERNAME != ''
        shell: pwsh
        run: |
          if (-not (Test-Path firmado\VortexsLive.exe)) { throw "eSigner no ha devuelto el programa firmado" }
          Copy-Item firmado\VortexsLive.exe VortexsLive.exe -Force
          $firma = Get-AuthenticodeSignature VortexsLive.exe
          "Firma: $($firma.Status) · $($firma.SignerCertificate.Subject)"
          if ($firma.Status -ne 'Valid') { throw "La firma no es válida: $($firma.StatusMessage)" }

      - name: Crear el ZIP de descarga
        shell: pwsh
        run: .\empaquetar.ps1

      - name: Guardar el ZIP (descargable desde la página de esta ejecución)
        uses: actions/upload-artifact@v7
        with:
          name: VortexsLive
          path: dist/*.zip

      # Instalador (dist\VortexsLive-Instalar.exe): se compila y se prueba instalando y desinstalando.
      - name: Crear y probar el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "No se encuentra Inno Setup" }
          $v = (Select-String -Path src\MainForm.cs -Pattern 'const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$v" instalador\VortexsLive.iss
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el instalador" }
          $setup = "dist\VortexsLive-Instalar.exe"
          "Instalador: $([math]::Round((Get-Item $setup).Length / 1KB)) KB"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=""""" -PassThru -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Vortexs Live"
          if (-not (Test-Path "$dir\VortexsLive.exe")) { throw "El instalador no dejó VortexsLive.exe en $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Vortexs Live.lnk")) { throw "Falta el acceso directo del menú Inicio" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\VortexsLive.exe") { throw "El desinstalador no quitó VortexsLive.exe" }
          "Instalador probado: instala en $dir, crea el acceso directo y se desinstala bien."

      - name: Crear la Release (al subir una etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          gh release view $env:ETIQUETA --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "La Release $env:ETIQUETA ya existe"; exit 0 }
          $v = $env:ETIQUETA.TrimStart('v')
          # Notas: .github/notas/vX.md si existe; si no, el apartado "Novedades de la X" del LEEME.
          $notas = ".github\notas\$($env:ETIQUETA).md"
          if (-not (Test-Path $notas)) {
            $leeme = Get-Content LEEME.txt -Raw -Encoding utf8
            $m = [regex]::Match($leeme, "(?s)Novedades de la $([regex]::Escape($v))\r?\n(.*?)(\r?\nNovedades de la|$)")
            $notas = "notas.md"
            Set-Content $notas ("## Novedades de la $v`n`n" + $m.Groups[1].Value) -Encoding utf8
          }
          gh release create $env:ETIQUETA --repo $env:GITHUB_REPOSITORY --title "Vortexs Live $v" --notes-file $notas --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la Release $env:ETIQUETA" }

      - name: Adjuntar el ZIP y el instalador a la Release
        if: github.event_name == 'release' || inputs.etiqueta != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta || github.ref_name }}
        run: |
          foreach ($zip in (Get-Item dist\*.zip, dist\VortexsLive-Instalar.exe)) {
            gh release upload $env:ETIQUETA $zip.FullName --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "No se pudo adjuntar $($zip.Name) a la Release" }
            "Adjuntado $($zip.Name) a la Release $env:ETIQUETA"
          }
