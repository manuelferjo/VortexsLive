<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat conjunto · Vortexs Live</title>
<style>
  :root {
    --bg: #09090c; --surface: #111116; --elev: #171720; --border: #26262e;
    --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
    --violet: #c09afd; --yellow: #ede103; --red: #ff4655; --green: #34d399;
    --twitch: #a970ff; --kick: #53fc18; --youtube: #ff3b3b; --tiktok: #fe2c55;
    --size: 15px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: var(--size)/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  body.overlay { background: transparent; }
  body.overlay header { display: none; }
  body.overlay .msg { text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  /* En pantalla los mensajes se apilan abajo, como en un chat de directo. */
  body.overlay #list { flex: 0 1 auto; min-height: 0; margin-top: auto; overflow-y: hidden; }
  body.overlay.demo { background: repeating-conic-gradient(#3a3a44 0 25%, #2b2b33 0 50%) 0 0 / 24px 24px; }

  /* ---------- Estilo del chat (Vortexs Live → Overlays → Personalizar chat) ---------- */
  /* Variables: --cfont --csize --ctx --clbl --cname --cacc --cbg --ccr. Clases cs-… en <body>. */
  body.cs { font-family: var(--cfont); font-size: var(--csize); }
  body.cs .msg, body.cs .ev { color: var(--ctx); }
  body.cs .ev .body { color: var(--clbl); }
  body.cs.cs-names-fixed .name { color: var(--cname) !important; }
  body.cs.cs-noicons .msg > .pf, body.cs.cs-noicons .ev .head > .pf { display: none; }
  body.cs.cs-nobadges .role, body.cs.cs-nobadges .badge { display: none; }
  body.cs.cs-noevents .ev { display: none; }
  body.cs.cs-fx-shadow .msg, body.cs.cs-fx-shadow .ev { text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.75); }
  body.cs.cs-fx-outline .msg, body.cs.cs-fx-outline .ev { text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 4px #000; }
  body.cs.cs-fx-none .msg, body.cs.cs-fx-none .ev { text-shadow: none; }
  /* Sin fondo: los avisos llevan solo su raya de color. */
  body.cs.cs-bg-none .ev { background: transparent; border: 0; border-left: 4px solid var(--c, var(--cacc)); border-radius: 0; }
  /* Fondo detrás de cada mensaje. */
  body.cs.cs-bg-bubbles .msg, body.cs.cs-bg-bubbles .ev { background: var(--cbg); border: 0; border-left: 3px solid var(--cacc); border-radius: var(--ccr); padding: .3em .75em; margin: .3em 0; width: fit-content; max-width: 100%; }
  body.cs.cs-bg-bubbles .ev { border-left-color: var(--c, var(--cacc)); }
  /* Fondo detrás de todo el chat. */
  body.cs.cs-bg-panel #list { background: var(--cbg); border-radius: var(--ccr); border-left: 3px solid var(--cacc); padding: .5em .8em; }
  body.cs.cs-bg-panel .ev { background: rgba(255,255,255,.06); border: 0; border-left: 3px solid var(--c, var(--cacc)); }
  body.cs.cs-right #list { text-align: right; }
  body.cs.cs-right.cs-bg-bubbles .msg, body.cs.cs-right.cs-bg-bubbles .ev { margin-left: auto; border-left: 0; border-right: 3px solid var(--cacc); }
  body.cs.cs-right .ev .head { justify-content: flex-end; }
  body.cs.cs-right .ev .amt { margin-left: 0; }
  body.cs.cs-anim-none .msg, body.cs.cs-anim-none .ev { animation: none; }
  body.cs.cs-anim-fade .msg, body.cs.cs-anim-fade .ev { animation: fadein .45s ease-out; }
  body.cs.cs-anim-pop .msg, body.cs.cs-anim-pop .ev { animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
  body.cs.cs-anim-slide.cs-right .msg, body.cs.cs-anim-slide.cs-right .ev { animation: inright .25s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes inright { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  header { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .total { font-weight: 700; font-size: 1.05em; margin-right: 4px; display: flex; align-items: center; gap: 6px; }
  .total .eye { color: var(--red); }
  .chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border-radius: 999px; background: var(--elev); border: 1px solid var(--border); font-size: .85em; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.off { opacity: .55; }
  .total, .chip { cursor: pointer; user-select: none; }
  .total:hover, .chip:hover { filter: brightness(1.25); }
  .hid { letter-spacing: .12em; color: var(--muted) !important; }
  .total .hid { font-weight: 600; font-size: .9em; letter-spacing: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--green); } .dot.wait { background: var(--yellow); } .dot.err { background: var(--red); }

  #list { flex: 1; overflow-y: auto; padding: 6px 10px 10px; scrollbar-width: thin; scrollbar-color: #33333d transparent; }
  .msg { padding: 3px 4px; border-radius: 6px; word-wrap: break-word; overflow-wrap: anywhere; animation: in .18s ease-out; }
  .msg:hover { background: rgba(255,255,255,.03); }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .pf { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -0.17em; margin-right: 5px; }
  /* Emblemas: las imágenes de Twitch (con Twitch conectado) o iconos propios, del mismo tamaño. */
  .badge { width: 1.3em; height: 1.3em; margin-right: 4px; vertical-align: -.28em; border-radius: 3px; }
  .role { display: inline-flex; align-items: center; justify-content: center; min-width: 1.3em; height: 1.3em; margin-right: 4px; border-radius: 4px; vertical-align: -.28em; color: #fff; box-shadow: inset 0 -1px 0 rgba(0,0,0,.18); }
  .role svg { width: .86em; height: .86em; fill: currentColor; }
  .role.txt { padding: 0 4px; font-size: .68em; height: 1.9em; min-width: 1.9em; font-weight: 800; letter-spacing: .02em; vertical-align: .12em; }
  .r-broadcaster { background: #e91916; } .r-mod { background: #00ad03; } .r-vip { background: #e005b9; }
  .r-sub { background: #8205b4; } .r-member { background: #0f9d58; } .r-founder { background: #d4a017; } .r-verified { background: #9147ff; } .r-og { background: #ff8a00; }
  .name { font-weight: 700; }
  .emote { height: 1.75em; vertical-align: middle; margin: -2px 1px; }
  .announce { border-left: 3px solid var(--violet); background: rgba(192,154,253,.08); padding-left: 8px; }

  .ev { margin: 6px 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--elev); border-left: 4px solid var(--c, var(--violet)); }
  .ev .head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .ev .ico { font-size: 1.15em; }
  .ev .amt { margin-left: auto; font-family: Consolas, monospace; font-size: .85em; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--c, var(--violet)); white-space: nowrap; }
  .ev .body { margin-top: 3px; color: var(--muted); }
  .k-sub, .k-resub { --c: var(--violet); } .k-gift, .k-giftbomb, .k-giftmember { --c: #ff6bd6; } .k-raid { --c: #ffb020; }
  .k-bits { --c: #8ab4ff; } .k-follow { --c: var(--green); } .k-superchat, .k-sticker { --c: var(--yellow); } .k-member { --c: var(--green); }
  .k-kicks { --c: var(--kick); } .k-tiktokgift { --c: var(--tiktok); } .k-other { --c: var(--dim); } .k-tip { --c: var(--yellow); } .k-reward { --c: #00c8af; }

  #composer { flex: none; border-top: 1px solid var(--border); background: var(--surface); padding: 8px 10px 10px; }
  body.overlay #composer, body.noinput #composer { display: none; }
  #targets { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; font-size: .8em; color: var(--dim); }
  #tgts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tgt { display: flex; align-items: center; gap: 4px; padding: 2px 9px 2px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--elev); color: var(--dim); cursor: pointer; font: inherit; }
  .tgt.on { color: var(--text); border-color: var(--violet); background: rgba(192,154,253,.12); }
  .tgt .pf { margin-right: 0; }
  #count { margin-left: auto; font-family: Consolas, monospace; }
  #count.over { color: var(--red); }
  .row { display: flex; gap: 8px; }
  /* ---------- Botón 😊 y panel de emotes ---------- */
  #emo-btn { flex: none; width: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; transition: border-color .15s, background .15s, transform .12s; }
  #emo-btn:hover, #emo-btn.on { border-color: var(--violet); background: rgba(192,154,253,.1); }
  #emo-btn:active { transform: scale(.92); }
  #emo { display: none; flex: none; flex-direction: column; height: 270px; border-top: 1px solid var(--border); background: var(--surface); }
  body.overlay #emo, body.noinput #emo { display: none !important; }
  #emo.open { display: flex; animation: emoIn .18s ease-out; }
  @keyframes emoIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #emo-top { display: flex; gap: 6px; padding: 8px 10px 6px; }
  #emo-q { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: .9em; outline: none; transition: border-color .15s; }
  #emo-q:focus { border-color: var(--violet); }
  #emo-tabs { display: flex; gap: 4px; padding: 0 10px 6px; overflow-x: auto; scrollbar-width: none; }
  #emo-tabs button { flex: none; font: inherit; font-size: .75em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--elev); color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
  #emo-tabs button:hover { color: var(--text); }
  #emo-tabs button.on { color: var(--text); border-color: var(--violet); background: rgba(192,154,253,.14); }
  #emo-grid { flex: 1; overflow-y: auto; padding: 0 10px 8px; }
  .emo-h { font-size: .7em; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 8px 0 4px; }
  .emo-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 3px; }
  .emo-i { height: 40px; display: flex; align-items: center; justify-content: center; padding: 3px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; transition: background .12s, border-color .12s, transform .12s; }
  .emo-i:hover { background: var(--elev); border-color: var(--border); transform: scale(1.1); }
  .emo-i:active { transform: scale(.95); }
  .emo-i img { max-width: 32px; max-height: 32px; }
  .emo-msg { color: var(--muted); font-size: .85em; padding: 14px 2px; text-align: center; }
  #emo-hint { font-size: .75em; color: var(--muted); padding: 0 10px 8px; }
  #emo-hint:empty { display: none; }
  #msg { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; outline: none; }
  #msg:focus { border-color: var(--violet); }
  #msg:disabled { opacity: .5; }
  #send { padding: 0 16px; border-radius: 10px; border: 0; background: linear-gradient(90deg, #c09afd, #ede103); color: #111; font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; }
  #send:disabled { opacity: .45; cursor: default; }
  #result { font-size: .8em; margin-top: 6px; min-height: 1.2em; color: var(--muted); }
  #result .ok { color: var(--green); } #result .bad { color: #ff8a95; }

  /* Moderación: pulsa un mensaje para borrarlo o expulsar a quien lo escribió */
  body:not(.overlay):not(.nomod) .msg[data-mod] { cursor: pointer; }
  .msg.modsel { background: rgba(192,154,253,.08); }
  /* Timeout arrastrando el nombre hacia la derecha: la barrita sale a la izquierda del mensaje. */
  .msg { position: relative; }
  body:not(.overlay):not(.nomod) .msg[data-mod] .name { touch-action: pan-y; user-select: none; cursor: grab; }
  .msg img, .msg svg { -webkit-user-drag: none; user-drag: none; }
  .msg.swiping { background: rgba(255,120,60,.07); transition: none; }
  .msg.swipe-back { transition: transform .18s ease-out; }
  .tswipe { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 5px; height: 1.5em; padding: 0 7px; border-radius: 6px;
    background: rgba(255,70,85,.18); color: #ffb8be; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: .8em; font-weight: 700;
    white-space: nowrap; z-index: 3; pointer-events: none; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .tswipe svg { width: 1.1em; height: 1.1em; fill: currentColor; flex: none; }
  .tswipe.cancel { background: rgba(255,255,255,.07); color: var(--dim); }
  .tswipe.ok { background: rgba(64,255,128,.14); color: var(--green); } .tswipe.bad { background: rgba(255,70,85,.2); color: #ff8a95; font-family: inherit; }
  .tswipe button { pointer-events: auto; font: inherit; border: 0; background: none; color: var(--yellow); cursor: pointer; padding: 0 0 0 3px; }
  .tswipe.fade { opacity: 0; transition: opacity .4s; }
  /* Enlaces del chat: se abren en una pestaña nueva (en pantalla, como texto normal). */
  a.lnk { color: var(--violet); text-decoration: underline; text-decoration-color: rgba(192,154,253,.45); text-underline-offset: 2px; word-break: break-all; }
  a.lnk:hover { text-decoration-color: var(--violet); }
  body.overlay a.lnk { color: inherit; text-decoration: none; pointer-events: none; }
  .modbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0 3px 22px; cursor: default; }
  .modbar button { font: inherit; font-size: .8em; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--elev); color: var(--text); cursor: pointer; }
  .modbar button:hover { border-color: var(--violet); }
  .modbar button.ban { border-color: rgba(255,70,85,.5); color: #ff8a95; }
  .modbar button.sure { background: var(--red); color: #fff; border-color: var(--red); }
  .modbar button:disabled { opacity: .5; cursor: default; }
  .modbar .mres { font-size: .8em; color: var(--muted); }
  .modbar .mres.ok { color: var(--green); } .modbar .mres.bad { color: #ff8a95; }
  .modbar button.undo { border-color: var(--yellow); color: var(--yellow); }
  .modbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }
  /* Ficha del usuario (botón Ficha) */
  .ucard { order: -1; flex-basis: 100%; margin-bottom: 2px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--elev); font-size: .85em; }
  .ucard .uh { display: flex; align-items: center; gap: 2px; font-weight: 700; margin-bottom: 6px; }
  .ucard .ur { color: var(--muted); margin: 2px 0; } .ucard .ur b { color: var(--text); font-weight: 600; }
  .ucard .ur.warn b { color: #ff8a95; }
  .ucard .ul { margin: 6px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .ucard .ul li { padding: 3px 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ucard .ul li span { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .ucard .un { color: var(--dim); font-size: .9em; margin-top: 5px; }
  /* Timeout: mantener pulsado y arrastrar hacia la derecha */
  .modbar button.tdrag { position: relative; overflow: hidden; min-width: 168px; text-align: left; cursor: ew-resize; touch-action: none; user-select: none; }
  .modbar button.tdrag .tfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(255,176,32,.30), rgba(255,70,85,.55)); transition: width .08s ease-out; pointer-events: none; }
  .modbar button.tdrag .tlbl { position: relative; font-variant-numeric: tabular-nums; }
  .modbar button.tdrag.on { border-color: var(--yellow); }
  body.tdragging, body.tdragging * { cursor: ew-resize !important; user-select: none !important; }
  .ucard .uload { color: var(--dim); }
  #reply { display: flex; align-items: center; gap: 6px; font-size: .8em; color: var(--muted); margin-bottom: 6px; }
  #reply[hidden] { display: none; }
  #reply b { color: var(--violet); }
  #reply button { font: inherit; border: 0; background: none; color: var(--dim); cursor: pointer; padding: 0 4px; }
  #reply button:hover { color: var(--text); }

  /* Panel de moderación (botón 🛡 de arriba): modos del chat de Twitch y borrar el chat. */
  .hsp { flex: 1; }
  #pollbtn, #modbtn { margin-left: 6px; }
  #featchip { color: var(--yellow); border-color: rgba(255,209,102,.35); }
  #featchip[hidden] { display: none; }
  body.overlay #pollbtn, body.nomod #pollbtn, body.overlay #featchip, body.nomod #featchip, body.overlay #pollpanel, body.nomod #pollpanel { display: none !important; }
  /* Panel de la encuesta (botón 🗳 Encuesta) */
  #pollpanel { display: none; flex: none; padding: 10px 12px 12px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: .85em; }
  #pollpanel.open { display: block; }
  #pollpanel input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 10px; margin: 3px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--elev); color: var(--text); outline: none; }
  #pollpanel input[type=text]:focus { border-color: var(--violet); }
  #pollpanel .orow { display: flex; align-items: center; gap: 6px; }
  #pollpanel .orow span { flex: none; width: 20px; text-align: center; color: var(--dim); font-weight: 700; }
  #pollpanel .orow button { flex: none; }
  #pollpanel .mrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 0; }
  #pollpanel .mlbl { color: var(--dim); min-width: 70px; }
  #pollpanel button { font: inherit; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--elev); color: var(--muted); cursor: pointer; }
  #pollpanel button.on { color: var(--text); border-color: var(--violet); background: rgba(192,154,253,.14); }
  #pollpanel button.go { color: #111; background: linear-gradient(90deg, var(--violet), var(--yellow)); border: 0; font-weight: 700; padding: 6px 16px; }
  #pollpanel button.sure { background: var(--red); color: #fff; border-color: var(--red); }
  #pollpanel .pchk { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  #prq { font-weight: 700; font-size: 1.08em; margin: 2px 0 8px; }
  .prb { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; margin: 5px 0; border-radius: 8px; background: var(--elev); overflow: hidden; }
  .prb i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--violet), var(--yellow)); opacity: .28; transition: width .5s; }
  .prb b, .prb span, .prb em { position: relative; } .prb b { width: 16px; color: var(--dim); } .prb em { margin-left: auto; font-style: normal; font-weight: 700; }
  .prb.win { box-shadow: inset 0 0 0 1.5px var(--yellow); }
  #prfoot { color: var(--dim); margin-top: 6px; }
  #pollstate { margin-top: 6px; font-size: .95em; } #pollstate.bad { color: #ff8a95; }
  body.overlay #modbtn, body.nomod #modbtn, body.overlay #modpanel, body.nomod #modpanel { display: none !important; }
  #modpanel { display: none; flex: none; padding: 8px 12px 10px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: .85em; }
  #modpanel.open { display: block; }
  #modpanel .mrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  #modpanel .mlbl { color: var(--dim); min-width: 92px; }
  #modpanel button { font: inherit; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--elev); color: var(--muted); cursor: pointer; }
  #modpanel button.on { color: var(--text); border-color: var(--violet); background: rgba(192,154,253,.14); }
  #modpanel button.danger { border-color: rgba(255,70,85,.5); color: #ff8a95; }
  #modpanel button.sure { background: var(--red); color: #fff; }
  #modpanel button:disabled { opacity: .5; cursor: default; }
  #modstate { color: var(--muted); margin-top: 4px; min-height: 1.2em; }
  #modstate.bad { color: #ff8a95; }
  #empty { color: var(--dim); text-align: center; margin-top: 30vh; font-size: .95em; }
  #more { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%); display: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--violet); color: #111; font-weight: 700; cursor: pointer; font-size: .85em; }
  #conn { display: none; position: fixed; top: 8px; right: 8px; padding: 4px 10px; border-radius: 999px; background: var(--red); color: #fff; font-size: .8em; }
</style>
</head>
<body>
<header>
  <span class="total"><span class="eye">●</span><span id="total">—</span></span>
  <span class="chip" id="c-twitch"><span class="dot"></span><span class="pfi"></span><b id="v-twitch">—</b></span>

    pnew.classList.remove('sure'); pnew.textContent = T('＋ Nueva encuesta');
    pollCall({ op: 'clear' });
  };
  function clockLeft(ms) { var s = Math.max(0, Math.ceil(ms / 1000)), mm = Math.floor(s / 60); s = s % 60; return mm + ':' + (s < 10 ? '0' : '') + s; }
  function renderPollPanel() {
    var p = pollNow;
    pollNew.hidden = !!p; pollRun.hidden = !p;
    document.getElementById('pollbtn').classList.toggle('on', !!(p && p.open));
    if (!p) return;
    var total = 0, best = 0;
    p.opts.forEach(function (o) { total += o.n; if (o.n > best) best = o.n; });
    document.getElementById('prq').textContent = p.q;
    document.getElementById('prbars').innerHTML = p.opts.map(function (o, i) {
      var pct = total ? Math.round(o.n * 100 / total) : 0;
      return '<div class="prb' + (!p.open && total && o.n === best ? ' win' : '') + '"><i style="width:' + pct + '%"></i><b>' + (i + 1) + '</b><span>' + esc(o.t) + '</span><em>' + pct + ' % · ' + o.n + '</em></div>';
    }).join('');
    var votes = total + ' ' + T(total === 1 ? 'voto' : 'votos');
    document.getElementById('prfoot').textContent = (p.open ? T('Abierta') + ' · ' + T('Se vota escribiendo 1, 2… en el chat') + (p.ends ? ' · ' + clockLeft(p.ends - (Date.now() + pollOff)) : '') : T('Terminada')) + ' · ' + votes;
    document.getElementById('pend').hidden = !p.open;
    pshow.textContent = p.shown ? T('🙈 Ocultar de pantalla') : T('👁 Enseñar en pantalla');
  }
  setInterval(function () { if (pollNow && pollNow.open && pollNow.ends && !pollRun.hidden) renderPollPanel(); }, 500);
  document.getElementById('pollbtn').onclick = function () {
    modpanel.classList.remove('open');
    if (pollpanel.classList.toggle('open') && !pollNow) setTimeout(function () { document.getElementById('pq').focus(); }, 0);
  };
  var featChip = document.getElementById('featchip');
  featChip.onclick = function () { modCall({ a: 'unfeature' }).catch(function () {}); };
  function onPoll(d) { pollNow = d || null; if (d) pollOff = (d.now || Date.now()) - Date.now(); renderPollPanel(); }
  function onFeature(d) { featNow = d || null; featChip.hidden = !featNow; }

  // ---------- Vista previa (?demo=1): mensajes de ejemplo ----------
  if (q.get('demo') === '1') {
    document.body.classList.add('demo');
    var DEMO = [
      { t: 'msg', p: 'twitch', user: 'Laura', color: '#FF4500', roles: ['mod', 'sub'], parts: [{ x: '¡Vaya jugada! Esto hay que clipearlo' }] },
      { t: 'msg', p: 'twitch', user: 'Vortexs_MC', color: '#9147FF', roles: ['broadcaster', 'verified'], parts: [{ x: 'bienvenidos al directo' }] },
      { t: 'msg', p: 'kick', user: 'KickFan', color: '#53FC18', roles: ['og', 'founder'], parts: [{ x: 'saludos desde Kick 👋' }] },
      { t: 'msg', p: 'youtube', user: 'ytfan', roles: ['member'], parts: [{ x: 'llego tarde, ¿qué me he perdido?' }] },
      { t: 'msg', p: 'tiktok', user: 'Marta 🌸', roles: [], parts: [{ x: 'holaaa desde TikTok' }] },
      { t: 'ev', p: 'twitch', user: 'Ana', kind: 'resub', text: 'Ana lleva 6 meses suscrita', parts: [{ x: '¡a por el directo!' }] },
      { t: 'msg', p: 'twitch', user: 'Pepe', color: '#1E90FF', roles: ['vip'], parts: [{ x: 'GG, qué nivel' }] },
      { t: 'msg', p: 'twitch', user: 'Laura', color: '#FF4500', roles: ['mod'], parts: [{ x: 'el horario está en vortexs.es/horario y los clips en https://www.twitch.tv/vortexs_mc/clips' }] },
      { t: 'ev', p: 'twitch', user: 'Pepe', kind: 'reward', text: 'Pepe ha canjeado Hidrátate', amount: '500 pts' },
      { t: 'ev', p: 'tiktok', user: 'Racha', kind: 'tiktokgift', text: 'Racha ha enviado 5 × Rosa', amount: '💎 5' },
      { t: 'msg', p: 'kick', user: 'Nocturno', color: '#B388FF', roles: [], parts: [{ x: 'el delay está en 30 s, tranquilos' }] }
    ];
    var di = 0;
    (function demo() { var m = JSON.parse(JSON.stringify(DEMO[di++ % DEMO.length])); m.id = 'demo' + di; if (m.t === 'msg') onMsg(m); else onEvent(m); setTimeout(demo, 1400); })();
  }
  styleTick();

  var conn = document.getElementById('conn');
  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () { conn.style.display = 'none'; };
    es.onerror = function () { conn.style.display = 'block'; };
    es.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'msg') onMsg(m);
      else if (m.t === 'ev') onEvent(m);
      else if (m.t === 'del') onDelete(m);
      else if (m.t === 'clear') { list.innerHTML = ''; }
      else if (m.t === 'viewers') { viewers = m.data || {}; renderHeader(); }
      else if (m.t === 'status') { states = m.data || {}; renderHeader(); }
      else if (m.t === 'poll') onPoll(m.data);
      else if (m.t === 'feature') onFeature(m.data);
    };
  }
})();
</script>
